<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback — BloodNet</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .feedback-section { padding: 5rem 0 4rem; }
    .feedback-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      text-align: center;
    }
    .stat-box__value {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--crimson-light);
    }
    .stat-box__label { font-size: 0.85rem; color: var(--white-muted); margin-top: 0.35rem; }
    .feedback-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .feedback-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }
    .feedback-card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .feedback-card__name { font-weight: 600; font-size: 0.95rem; }
    .feedback-card__hospital { font-size: 0.8rem; color: var(--white-muted); margin-bottom: 0.5rem; }
    .feedback-card__comment { font-size: 0.875rem; color: var(--white-dim); line-height: 1.5; }
    .stars { color: #f59e0b; font-size: 1.1rem; letter-spacing: 2px; }
    .loading-msg { text-align:center; padding:3rem; color:var(--white-muted); font-size:1.1rem; }
    @media (max-width: 768px) {
      .feedback-stats { grid-template-columns: 1fr; }
      .feedback-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar scrolled">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-icon">🩸</div>
        BloodNet
      </a>
      <ul class="navbar__links">
        <li><a href="find-donor.html">Find Donor</a></li>
        <li><a href="blood-banks.html">Blood Banks</a></li>
        <li><a href="campaigns.html">Campaigns</a></li>
        <li><a href="emergency.html">Emergency</a></li>
      </ul>
      <a href="dashboard.php" class="btn btn-outline btn-sm navbar__cta">Dashboard</a>
    </div>
  </nav>

  <section class="feedback-section">
    <div class="container">
      <div class="text-center mb-3">
        <span class="section-label">Community Reviews</span>
        <h2 class="section-title">Donor Feedback</h2>
        <div class="divider divider-center"></div>
      </div>

      <div id="loadingMsg" class="loading-msg">⏳ Loading feedback...</div>
      <div id="errorMsg"   style="display:none;" class="loading-msg"></div>

      <div id="feedbackContent" style="display:none;">
        <div class="feedback-stats">
          <div class="stat-box">
            <div class="stat-box__value" id="avgRating">—</div>
            <div class="stat-box__label">Overall Rating (out of 5)</div>
          </div>
          <div class="stat-box">
            <div class="stat-box__value" id="totalReviews">—</div>
            <div class="stat-box__label">Total Reviews</div>
          </div>
          <div class="stat-box">
            <div class="stat-box__value" id="topHospital">—</div>
            <div class="stat-box__label">Top Rated Hospital</div>
          </div>
        </div>

        <h3 style="margin-bottom:1.25rem;">Recent Feedback</h3>
        <div class="feedback-grid" id="feedbackGrid">
          <!-- populated by JS -->
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <span>© 2026 BloodNet — Smart Blood &amp; Emergency Donor Network</span>
      </div>
    </div>
  </footer>

  <script>
    const BACKEND = 'http://localhost/smart-blood-donor/backend';

    function stars(rating) {
      return '★'.repeat(rating) + '☆'.repeat(5 - rating);
    }

    async function loadFeedback() {
      const loadEl    = document.getElementById('loadingMsg');
      const errEl     = document.getElementById('errorMsg');
      const contentEl = document.getElementById('feedbackContent');

      try {
        const res  = await fetch(`${BACKEND}/api/feedback.php`);
        const data = await res.json();

        loadEl.style.display    = 'none';
        contentEl.style.display = 'block';

        document.getElementById('avgRating').textContent    = data.overallAvgRating ? data.overallAvgRating.toFixed(1) : '—';
        document.getElementById('totalReviews').textContent = data.totalReviews      || '0';
        document.getElementById('topHospital').textContent  = data.byHospital && data.byHospital.length
          ? data.byHospital[0].hospital : '—';

        const grid = document.getElementById('feedbackGrid');
        if (!data.feedbacks || data.feedbacks.length === 0) {
          grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--white-muted);">No feedback yet.</div>';
        } else {
          grid.innerHTML = data.feedbacks.map(f => `
            <div class="feedback-card reveal">
              <div class="feedback-card__header">
                <div class="feedback-card__name">${f.donorName}</div>
                <div class="stars">${stars(f.rating)}</div>
              </div>
              <div class="feedback-card__hospital">🏥 ${f.hospitalCenter || 'General'}</div>
              <div class="feedback-card__comment">${f.comment || '<em>No comment</em>'}</div>
              <div style="font-size:0.75rem;color:var(--white-muted);margin-top:0.75rem;">${f.createdAt || ''}</div>
            </div>
          `).join('');
        }
      } catch {
        loadEl.style.display = 'none';
        errEl.style.display  = 'block';
        errEl.textContent    = '⚠️ Could not load feedback. Make sure XAMPP is running.';
      }
    }

    loadFeedback();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
